{# 등록된 크롤러 표. 페이지 로드 때 한 번, 등록·저장 뒤 OOB 로 다시 들어온다 #}
<table>
  <caption>등록된 크롤러</caption>
  <thead>
    <tr>
      <th scope="col">번호</th>
      <th scope="col">이름</th>
      <th scope="col">상태</th>
      <th scope="col">리스트 URL</th>
      <th scope="col">동작</th>
    </tr>
  </thead>
  <tbody>
    {% for crawler in crawlers %}
    <tr>
      <td>{{ crawler.id }}</td>
      <td>{{ crawler.name }}</td>
      <td>{{ crawler.status }}</td>
      <td>{{ crawler.list_url }}</td>
      <td>
        <button type="button"
                hx-get="/ui/crawlers/{{ crawler.id }}/editor"
                hx-target="#crawler-result"
                hx-swap="innerHTML">셀렉터 편집</button>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="5">등록된 크롤러가 없다</td></tr>
    {% endfor %}
  </tbody>
</table>
