{% extends "pages/settings.html" %}
{% from "macros.html" import empty %}
{% block section %}
<section>
  <h3>동시 실행 상한</h3>
  <p>
    저장한 값은 다음에 값을 읽는 쪽부터 적용된다. 재시작하지 않는다.
    한 번 저장된 뒤로는 환경변수를 고쳐도 이 값이 이긴다.
  </p>
  <div id="settings-form" hx-get="/ui/settings" hx-trigger="load" hx-swap="innerHTML">
    {{ empty("설정을 불러오는 중") }}
  </div>
</section>
{% endblock %}
