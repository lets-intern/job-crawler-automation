{% extends "base.html" %}
{% block title %}크롤러 등록{% endblock %}
{% block heading %}크롤러 등록과 셀렉터 편집{% endblock %}
{% block content %}
<section>
  <h3>새 크롤러</h3>
  <form hx-post="/ui/crawlers" hx-target="#crawler-result" hx-swap="innerHTML">
    <fieldset>
      <legend>리스트 URL 과 상세 URL 로 셀렉터를 생성한다</legend>
      <p>
        <label for="list-url">리스트 URL</label>
        <br>
        <input id="list-url" name="list_url" type="url" size="80" required>
      </p>
      <p>
        <label for="detail-url">상세 URL</label>
        <br>
        <input id="detail-url" name="detail_url" type="url" size="80" required>
      </p>
      <p>
        <label for="crawler-name">이름 (비우면 도메인)</label>
        <br>
        <input id="crawler-name" name="name" type="text" size="40">
      </p>
      <button type="submit">셀렉터 생성</button>
    </fieldset>
  </form>
</section>

<section>
  <h3>결과</h3>
  <div id="crawler-result">
    <p>생성하거나 목록에서 크롤러를 고르면 여기에 결과와 편집기가 들어온다.</p>
  </div>
</section>

<section>
  <h3>등록된 크롤러</h3>
  <div id="crawler-list" hx-get="/ui/crawlers" hx-trigger="load" hx-swap="innerHTML">
    <p>목록을 불러오는 중</p>
  </div>
</section>
{% endblock %}
